name: CI


on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      
      - uses: pyodide/setup-emsdk@v15
        with:
          version: 3.1.69
          actions-cache-folder: 'emsdk-cache'
      
      - name: Build-WASM
        run: |
          emcc -v
          mkdir wasm-cpp/build-wasm
          cd wasm-cpp/build-wasm
          emcmake cmake ..                      \
            -DCMAKE_BUILD_TYPE=Release          \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          emmake make
      
      - name: Deno
        run: |
          ./deno.sh task install
      
      - name: Test
        run: |
          ./run_tests.sh
      
      - name: Build-App
        run: |
          ./build.ts --minify
      
      - name: Archive Build
        uses: actions/upload-artifact@v4
        with:
          name: pagebuild
          path: |
            static/*
          if-no-files-found: error

      - name: Compare bundle size
        id: bundle_comparison
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          REPONAME=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)
          DEPLOYMENTURL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPONAME}/"
          echo $DEPLOYMENTURL

          ./deno.sh run             \
            --allow-read=./         \
            --allow-net=*.github.io \
            .github/scripts/compare_bundle_size.ts \
            "$DEPLOYMENTURL" \
            ./static/ \
            > bundle_comparison.md
          cat bundle_comparison.md

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat bundle_comparison.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
    outputs:
      bundle_report: ${{ steps.bundle_comparison.outputs.report }}

  # as own job for minimal permissions
  comment-in-pr:
    needs: build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions: 
      pull-requests: write 
    steps:
      - name: Comment to PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: ${{ needs.build.outputs.bundle_report }}
          comment-tag: bundlecomparison



  deploy:
    needs:   build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.inputs.release == 'true' }}

    steps:
      - uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: pagebuild
          path: artifact/

      - name: Release
        run: |
          TAGNAME=v$(date +%F)
          echo $TAGNAME

          git fetch origin gh-pages
          git checkout gh-pages
          cp artifact/* ./
          rm -r artifact
          ls ./

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ./*
          git commit -m "$TAGNAME"
          git tag --force $TAGNAME
          git push origin gh-pages
          git push --force origin --tags
